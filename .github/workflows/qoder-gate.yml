name: Content gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

jobs:
  gate:
    name: Six-check content gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the gate is installed
        run: |
          if [ ! -f scripts/gate.mjs ]; then
            echo "scripts/gate.mjs not found. Install the content pack first: ./install.sh <repo> --config <name>" >&2
            exit 1
          fi
      - name: Run gate (SARIF)
        run: node scripts/gate.mjs --format sarif --out gate.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gate.sarif
          category: content-gate
      - name: Run gate (text summary)
        if: always()
        run: node scripts/gate.mjs --format text

  gate-self-test:
    name: Gate tests and repository gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the gate's own tests
        run: node --test test/gate.test.mjs
      - name: Run the repository gate
        if: always()
        run: node scripts/repo-gate.mjs

  external-links:
    name: Weekly external link check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check external links
        run: node scripts/gate.mjs --only links --external --format text

  qoder-review:
    name: Qoder AI review (optional)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # The Qoder CLI authenticates in CI from this variable. GitHub does not
      # pass secrets to pull requests from forks, so those always skip.
      QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for Qoder credentials
        id: check
        run: |
          if [ -z "${QODER_PERSONAL_ACCESS_TOKEN:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            reason="The repository secret QODER_PERSONAL_ACCESS_TOKEN is not set (or this pull request comes from a fork, which receives no secrets), so the AI review did not run. Add the secret under Settings > Secrets and variables > Actions to enable it."
            echo "::notice title=Qoder AI review skipped::${reason}"
            {
              echo "### Qoder AI review skipped"
              echo
              echo "${reason}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: '20'
      - name: Install the Qoder CLI
        if: steps.check.outputs.enabled == 'true'
        # GitHub-hosted runners do not ship the CLI; install a pinned version.
        run: |
          npm install -g @qoder-ai/qodercli@1.1.89
          qoder --version
      - name: Run Qoder headless review
        if: steps.check.outputs.enabled == 'true'
        run: |
          if ! qoder -p "Review this pull request's content changes against AGENTS.md and .qoder/rules. Report only concrete violations of the disclaimer, GACAR citation, bilingual parity, repository register, link, and source-freshness policies. Do not rewrite aviation facts. Output a short Markdown comment." \
            --output-format json \
            --permission-mode accept_edits \
            --max-turns 20 > qoder-review.json 2> qoder-review.err; then
            echo "--- qoder stderr ---"
            tail -20 qoder-review.err
            echo "::error title=Qoder AI review failed::The Qoder CLI exited non-zero. If stderr reports an authentication error, QODER_PERSONAL_ACCESS_TOKEN is missing, invalid or expired: replace it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          node <<'EOF'
          const fs = require('fs');
          const raw = fs.readFileSync('qoder-review.json', 'utf8');
          let text = '';
          try {
            const r = JSON.parse(raw);
            text = typeof r.result === 'string' ? r.result : (r.result && r.result.text) || r.message || '';
          } catch {
            // Not a single JSON document; post the raw output instead.
            text = raw.trim();
          }
          fs.writeFileSync('qoder-comment.md', text || 'Qoder review produced no comment.');
          EOF
      - name: Post the review as a PR comment
        if: steps.check.outputs.enabled == 'true'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: gh pr comment "$PR_NUMBER" --body-file qoder-comment.md
